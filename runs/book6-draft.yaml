# A run policy. Everything here can change between runs, and the gates can
# change mid-book: full manual while you are calibrating trust, auto_if_clean
# once the checkers have earned it, manual again for the ending.
name: book6-draft

gates:
  plan:    manual                  # invention is where human attention belongs
  chapter: auto_if_clean           # auto-accept when every hard check passes
  act:     manual                  # always stop at act breaks

candidates:
  per_scene: 3
  revision_rounds: 2

context:
  start_tokens: 30000
  max_tokens:   50000              # only reached when marginalia asks for more

models:
  plan:    claude-fable-5-1        # hardest judgment calls, smallest token count
  draft:   claude-opus-5
  extract: claude-sonnet-5         # volume work with strict schemas, run in batch
  checks:  claude-haiku-4-5
  judge:   claude-sonnet-5

checks:
  epistemic:  hard
  geography:  hard
  objects:    hard
  card:       hard
  repetition: {severity: soft, budget: corpus_baseline}
  voice:      soft
  consequence: soft
  discriminator: floor             # a floor against obvious machine prose,
                                   # never an optimisation target — that way beige
  panel:      soft

budget:
  max_usd: 400
